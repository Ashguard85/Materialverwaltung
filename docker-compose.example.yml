services:
  app:
    build:
      context: https://github.com/USER/maker-inventar-docker.git#main
    container_name: maker-inventar
    ports:
      - "8090:8080"
    volumes:
      - /home/USER/docker/maker-inventar/data:/app/data
    environment:
      APP_TITLE: Maker Inventar
      APP_URL: https://api.example.com
      DOCKER_WEB_URL: https://docker-app.example.com
      SECRET_KEY: ${SECRET_KEY}
      AUTH_ENABLED: "false"
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      BACKUP_KEEP: "50"
      IMAGE_MAX_BYTES: "4194304"
      PWA_ALLOWED_ORIGIN: https://app.example.com
    restart: unless-stopped
